<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <title>Basic Shader (Unlit) • three.js r128</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0
    }

    canvas {
      display: block
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
</head>

<body>
  <script>
    // Scene / Camera / Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.8, 2.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    new THREE.OrbitControls(camera, renderer.domElement);

    // --- Basic Shader (Unlit) ---
    const uniforms = {
      uColor: { value: new THREE.Color(0xffaa00) },// เปลี่ยนสีได้ที่นี่
      time: { value: 1.0 },
      uLightDir: { value: new THREE.Vector3(0.5, 0.9, 0.3).normalize() }
    };

    const vert = `
    varying vec2 vUv;
    uniform float time;
    varying vec3 vPosition;
    varying vec3 vNormal;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vPosition = vec3(cos(time)*0.01,0.0,sin(time)*0.01);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position + vPosition, 1.0); // ตำแหน่ง
    }
  `;

    const frag = `
    precision highp float;
    varying vec2 vUv;
    uniform vec3 uColor;
    uniform vec3 uLightDir;
    varying vec3 vNormal;
    
    void main() {
      // gl_FragColor = vec4(uColor, 1.0);
      
      //float g = smoothstep(0.0, 1.0, vUv.y);
       float g = dot(normalize(vNormal), uLightDir);
       gl_FragColor = vec4(mix(uColor*0.3, uColor, g), 1.0);
    }
  `;

    // Geometry
    const geo = new THREE.SphereBufferGeometry(0.7, 6, 6);
    const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms });

    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    // Resize & Animate
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function loop() {
      mesh.rotation.z += 0.1; // หมุนช้าๆ ให้เห็นว่า “สีไม่เปลี่ยนตามไฟ”
      uniforms.time.value += 0.05;
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    })();
  </script>
</body>

</html>
